name: tst_pana
description: >-
  A customizable Flutter package for displaying interactive 360° panoramic images
  with gesture controls, gyroscope sensor support, and interactive hotspots.

version: 1.0.0
homepage: https://github.com/user-yormen/tst_pana

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

#environment:
#  sdk: ^3.8.1
#  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  panorama_viewer: ^2.0.7
  dchs_motion_sensors: ^2.0.1
  flutter_cube: ^0.1.1
  camera: ^0.10.0
  image_picker: ^1.0.0
  image: ^4.1.0          # pure-Dart pixel manipulation for stitching
  path_provider: ^2.0.0  # write stitched JPEG to temp directory


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
#  flutter_lints: ^3.0.0